<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiTrack — Shipments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap">
  <link rel="stylesheet" href="../style/variables.css">
  <link rel="stylesheet" href="../style/reset.css">
  <link rel="stylesheet" href="../style/main.css">
  <link rel="stylesheet" href="../style/components.css">
  <script type="module" src="../js/main.js"></script>
</head>
<body>
  <header class="header">
    <a class="header__brand" href="./index.html">LogiTrack</a>
    <button class="btn btn--primary" type="button">New shipment</button>
  </header>

  <div class="layout">
    <aside class="filters" aria-label="Filters">
      <label class="field">
        <span class="field__label">Status</span>
        <select id="status-filter" name="status">
          <option value="">All statuses</option>
          <option value="IN_TRANSIT">In transit</option>
          <option value="DELIVERED">Delivered</option>
          <option value="DELAYED">Delayed</option>
          <option value="PENDING">Pending</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Carrier</span>
        <select id="carrier-filter" name="carrier">
          <option value="">All carriers</option>
          <option value="DHL">DHL</option>
          <option value="Chronopost">Chronopost</option>
          <option value="FedEx">FedEx</option>
          <option value="UPS">UPS</option>
        </select>
      </label>
    </aside>

    <main class="content">
      <div class="toolbar">
        <h1>Shipments <span class="toolbar__count" id="shipment-count"></span></h1>

        <input id="search" class="toolbar__search" type="search" placeholder="Search" aria-label="Search by tracking number or recipient">

        <select id="sort" class="toolbar__sort" aria-label="Sort by">
          <option value="date-asc">Estimated date ↑</option>
          <option value="date-desc">Estimated date ↓</option>
          <option value="priority">Priority first</option>
        </select>
      </div>

      <section id="shipment-list" class="shipment-list" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="shipment-modal" class="modal" aria-labelledby="modal-title">
    <div class="modal__body">
      <div class="row">
        <h2 id="modal-title" class="modal__title"></h2>
        <button class="btn" type="button" data-action="close" aria-label="Close">✕</button>
      </div>
      <dl id="modal-details" class="modal__details"></dl>

      <form id="modal-form" class="modal__form">
        <label class="field">
          <span class="field__label">Status</span>
          <select name="status">
            <option value="IN_TRANSIT">In transit</option>
            <option value="DELIVERED">Delivered</option>
            <option value="DELAYED">Delayed</option>
            <option value="PENDING">Pending</option>
          </select>
        </label>

        <label class="checkbox">
          <input type="checkbox" name="isPriority">
          Priority shipment
        </label>

        <label class="field">
          <span class="field__label">Internal notes</span>
          <textarea name="internalNotes" rows="3"></textarea>
        </label>

        <p class="error" role="alert" hidden>Couldn't save changes. Try again.</p>

        <button class="btn btn--primary" type="submit">Save</button>
      </form>
    </div>
  </dialog>
</body>
</html>
